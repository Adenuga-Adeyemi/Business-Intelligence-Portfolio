<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#ffffff"/>
<text x="60" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#1f2937">Data Quality Audit</text>
<text x="60" y="86" font-family="Arial" font-size="16" fill="#6b7280">Issues and documented corrective actions</text>
<rect x="60" y="125" width="1080" height="68" rx="10" fill="#f8fafc" stroke="#d1d5db"/><text x="85" y="153" font-family="Arial" font-size="15" font-weight="700" fill="#111827">12 exact duplicate rows</text><text x="390" y="153" font-family="Arial" font-size="14" fill="#374151">Removed duplicates</text><text x="850" y="153" font-family="Arial" font-size="14" fill="#64748b">432 → 420 rows</text><rect x="60" y="213" width="1080" height="68" rx="10" fill="#f8fafc" stroke="#d1d5db"/><text x="85" y="241" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Inconsistent labels</text><text x="390" y="241" font-family="Arial" font-size="14" fill="#374151">Trim + Capitalize + Replace Values</text><text x="850" y="241" font-family="Arial" font-size="14" fill="#64748b">State and category grouping</text><rect x="60" y="301" width="1080" height="68" rx="10" fill="#f8fafc" stroke="#d1d5db"/><text x="85" y="329" font-family="Arial" font-size="15" font-weight="700" fill="#111827">22 incorrect revenue values</text><text x="390" y="329" font-family="Arial" font-size="14" fill="#374151">Recalculate Actual Revenue</text><text x="850" y="329" font-family="Arial" font-size="14" fill="#64748b">Units × Price × (1 − Discount)</text><rect x="60" y="389" width="1080" height="68" rx="10" fill="#f8fafc" stroke="#d1d5db"/><text x="85" y="417" font-family="Arial" font-size="15" font-weight="700" fill="#111827">31 missing costs</text><text x="390" y="417" font-family="Arial" font-size="14" fill="#374151">Product-level median imputation</text><text x="850" y="417" font-family="Arial" font-size="14" fill="#64748b">Complete cost basis for profit</text>
<text x="60" y="492" font-family="Arial" font-size="14" fill="#475569">Documented audit impact: duplicate rows and incorrect reported revenue materially overstated performance and reversed market rankings.</text>
</svg>